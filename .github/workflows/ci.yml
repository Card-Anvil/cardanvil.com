name: CI

on:
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
      # Before install: `npm ci` runs `prepare`, which would regenerate the
      # committed agent config and hide any drift.
      - run: npm run sync:agents:check
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
